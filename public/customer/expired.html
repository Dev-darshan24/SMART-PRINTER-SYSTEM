<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Expired — SmartPrint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('smartprint_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">
  <div class="glass-panel text-center" style="max-width: 460px; width: 100%; padding: 2.5rem; box-shadow: var(--shadow-glass);">
    <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--warning-bg); color: var(--warning-solid); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    </div>
    <h2>Document Expired</h2>
    <p class="text-sm text-muted" style="margin: 0.75rem 0 1.5rem;">
      In accordance with our 24-hour privacy and retention policy, this print job has been deleted from cloud storage.
    </p>
    <a href="/customer/" class="btn btn-primary w-full">
      Submit New Document
    </a>
  </div>
</body>
</html>
