<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SmartPrint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('smartprint_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">
  <div class="glass-panel" style="max-width: 440px; width: 100%; padding: 2.5rem; box-shadow: var(--shadow-glass);">
    <div class="text-center" style="margin-bottom: 2rem;">
      <h2>Reset Password</h2>
      <p class="text-sm text-muted">Enter your registered management email to receive instructions.</p>
    </div>

    <form id="forgot-form">
      <div class="form-group">
        <label for="reset-email" class="form-label">Email Address</label>
        <input type="email" id="reset-email" class="form-input" placeholder="owner@center.com" required />
      </div>

      <button type="submit" class="btn btn-primary w-full">
        Send Reset Link
      </button>
    </form>

    <div class="text-center" style="margin-top: 1.5rem; font-size: 0.8125rem;">
      <a href="/login.html" class="text-muted">&larr; Back to Login</a>
    </div>
  </div>

  <script type="module">
    import { showToast } from '/assets/js/ui.js';
    document.getElementById('forgot-form').addEventListener('submit', (e) => {
      e.preventDefault();
      showToast("Password reset instructions sent to your email.", "success");
      setTimeout(() => window.location.href = '/login.html', 1500);
    });
  </script>
</body>
</html>
