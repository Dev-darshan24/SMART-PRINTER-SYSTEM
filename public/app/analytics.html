<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartPrint — Center Analytics & Insights</title>
  <meta name="description" content="Comprehensive revenue trends, comparative breakdown, and job fulfillment statistics." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/dashboard.css" />
  <script src="/__env.js"></script>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('smartprint_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <script type="module">
    import { authManager, ROLES } from '/assets/js/auth/authManager.js';
    const user = authManager.getCurrentUser();
    if (!user || (user.role !== ROLES.OWNER && user.role !== ROLES.SUPERADMIN)) {
      window.location.replace('/login.html?redirect=' + encodeURIComponent(window.location.pathname));
    }
  </script>
</head>
<body>
  <div class="app-layout">
    <!-- Slide Bar (Sidebar) -->
    <aside class="app-sidebar" id="app-sidebar" aria-label="Main Navigation">
      <div class="sidebar-header">
        <a href="/app/index.html" class="brand-logo">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          </div>
          <span>SmartPrint</span>
        </a>
        <button type="button" class="sidebar-hide-btn" id="sidebar-hide-btn" aria-label="Toggle Slide Bar" title="Toggle Slide Bar">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="3"></rect>
            <path d="M9 3v18"></path>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <!-- 1. Dashboard -->
        <a href="/app/index.html" class="nav-item sidebar-tab-btn" data-view="dashboard" id="nav-btn-dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Dashboard</span>
        </a>

        <!-- 2. History -->
        <a href="/app/history.html" class="nav-item sidebar-tab-btn" data-view="history" id="nav-btn-history">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span>History</span>
        </a>

        <!-- 3. Analytics -->
        <a href="/app/analytics.html" class="nav-item active sidebar-tab-btn" data-view="analytics" id="nav-btn-analytics">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span>Analytics</span>
        </a>

        <!-- 4. Setting -->
        <a href="/app/settings.html" class="nav-item sidebar-tab-btn" data-view="settings" id="nav-btn-settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span>Setting</span>
        </a>

        <!-- 5. Profile -->
        <a href="/app/profile.html" class="nav-item sidebar-tab-btn" data-view="profile" id="nav-btn-profile">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="user-avatar" id="user-avatar-initials">--</div>
          <div class="user-info">
            <span class="user-name" id="current-center-name">Loading center...</span>
            <span class="user-role" id="current-user-email">owner@center.com</span>
          </div>
        </div>
        <button type="button" class="sidebar-logout-btn" id="logout-btn" title="Sign Out" aria-label="Sign Out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Slide Bar Mobile Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Main Workspace -->
    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="btn-sidebar-toggle" id="sidebar-toggle-btn" aria-label="Toggle navigation slide bar" aria-controls="app-sidebar" aria-expanded="true" title="Toggle Slide Bar">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="3"></rect>
              <path d="M9 3v18"></path>
            </svg>
          </button>
          <div class="breadcrumb-trail">
            <span>SmartPrint</span>
            <span>/</span>
            <span class="breadcrumb-current" id="view-title-breadcrumb">Analytics</span>
          </div>
        </div>

        <div class="topbar-actions">
          <!-- Store Open / Closed Status Toggle Button -->
          <button type="button" class="store-status-btn open" id="store-status-btn" aria-label="Store Status: Open. Click to close store" title="Store is OPEN (Accepting Orders). Click to toggle.">
            <span class="store-status-dot"></span>
            <span class="store-status-text" id="store-status-text">Store Open</span>
          </button>

          <!-- Small Dark / Light Theme Toggle Button -->
          <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Toggle Dark / Light Theme" title="Toggle Dark/Light Theme">
            <span id="theme-icon-moon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" transform="matrix(-1 0 0 1 24 0)"></path>
              </svg>
            </span>
            <span id="theme-icon-sun" style="display: none;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
            </span>
          </button>
        </div>
      </header>

      <div class="workspace-content">
        <!-- VIEW 3: ANALYTICS -->
        <div id="view-analytics" class="tab-view-content" style="display: block;">
          <!-- Header and Filter Controls -->
          <div class="flex justify-between items-center" style="margin-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem;">
            <div>
              <div class="flex items-center gap-2">
                <h2 style="margin-bottom: 0;">Center Analytics & Insights</h2>
                <span class="badge" id="analytics-total-badge" style="background: var(--primary-100); color: var(--primary-700); font-weight: 600;">Active Metrics</span>
              </div>
              <p class="text-xs text-muted" id="analytics-filter-subtext" style="margin-top: 0.25rem;">
                Comprehensive revenue trends, comparative breakdown, and job fulfillment statistics
              </p>
            </div>

            <div class="flex items-center gap-2">
              <!-- Export CSV Action Button -->
              <button type="button" class="btn btn-secondary btn-sm" id="btn-export-analytics-csv" title="Export Analytics to CSV" style="display: inline-flex; align-items: center; gap: 0.375rem; font-weight: 600;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span>Export CSV</span>
              </button>
            </div>
          </div>

          <!-- Timeframe Filter Controls Bar -->
          <div class="filter-bar" style="margin-bottom: 1.5rem; gap: 0.75rem; flex-wrap: wrap; align-items: center;">
            <div class="filter-tabs" role="tablist" aria-label="Analytics timeframe range" id="analytics-filter-group" style="flex-wrap: wrap;">
              <button type="button" class="filter-tab analytics-filter-btn" data-range="today">Today</button>
              <button type="button" class="filter-tab analytics-filter-btn" data-range="yesterday">Yesterday</button>
              <button type="button" class="filter-tab analytics-filter-btn" data-range="7days">Last 7 Days</button>
              <button type="button" class="filter-tab analytics-filter-btn" data-range="30days">30 Days</button>
              <button type="button" class="filter-tab analytics-filter-btn" data-range="this_month">This Month</button>
              <button type="button" class="filter-tab analytics-filter-btn" data-range="prev_month">Previous Month</button>
              <button type="button" class="filter-tab analytics-filter-btn" data-range="3months">3 Months</button>
              <button type="button" class="filter-tab analytics-filter-btn" data-range="6months">6 Months</button>
              <button type="button" class="filter-tab analytics-filter-btn" data-range="1year" id="analytics-year-filter-btn">
                <span id="analytics-year-tab-label">2026 - 2027</span>
              </button>
              <button type="button" class="filter-tab analytics-filter-btn active" data-range="all">All Time</button>
              <button type="button" class="filter-tab analytics-filter-btn" data-range="custom" id="analytics-custom-filter-btn">Custom Range</button>
            </div>

            <!-- Custom Date Inputs (displayed when Custom Range is selected) -->
            <div id="analytics-custom-date-container" class="flex items-center gap-2" style="display: none; flex-wrap: wrap;">
              <input type="date" id="analytics-custom-start" class="form-input" style="padding: 0.35rem 0.6rem; font-size: 0.8125rem; width: auto;" aria-label="Start Date" />
              <span class="text-xs text-muted">to</span>
              <input type="date" id="analytics-custom-end" class="form-input" style="padding: 0.35rem 0.6rem; font-size: 0.8125rem; width: auto;" aria-label="End Date" />
              <button type="button" class="btn btn-primary btn-sm" id="btn-apply-custom-date" style="padding: 0.35rem 0.75rem; font-size: 0.8125rem;">Apply</button>
            </div>
          </div>

          <!-- Dynamic Analytics Content (KPIs, Graphs, Comparisons, Detail Table) -->
          <div id="analytics-content-view">
            <!-- Dynamically populated by renderAnalyticsSection() in app.js -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
